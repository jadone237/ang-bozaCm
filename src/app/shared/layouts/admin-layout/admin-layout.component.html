<div class="dashboard-wrapper">
  
  <!-- Voile sombre mobile -->
  @if (isSidebarOpen) {
    <div class="sidebar-overlay" (click)="fermerSidebar()"></div>
  }

  <!-- ================= BARRE LATÉRALE (SIDEBAR) ================= -->
  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div>
      <!-- Header Sidebar -->
      <div class="sidebar-header mb-4 px-2 d-flex justify-content-between align-items-center">
        <div>
          <h4 class="fw-bold text-dark mb-0">Cameroun Voyage</h4>
          <p class="fw-bold text-muted mb-0">Plateforme d'administration</p>
        </div>
        <button class="btn-close-sidebar d-md-none" (click)="fermerSidebar()" aria-label="Fermer">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- Navigation Dashboard -->
      <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item">
          <a routerLink="/admin/agences" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-building"></i> Agences
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/trajets" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-signpost-split"></i> Trajets
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/offres" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-tag"></i> Offres
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/reservations" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-journal-text"></i> Réservations
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/statistiques" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-bar-chart"></i> Statistiques
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/rapports" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-file-earmark-text"></i> Rapports
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/profil" routerLinkActive="active" (click)="fermerSidebar()" class="nav-link">
            <i class="bi bi-person-circle"></i> Mon profil
          </a>
        </li>
      </ul>
    </div>

    <!-- Pied de Sidebar -->
    <div class="border-top pt-3">
      <!-- Déconnexion réelle : supprime le jeton JWT puis renvoie vers /login (AuthService) -->
      <a href="" (click)="deconnexion($event)" class="nav-link text-danger d-flex align-items-center gap-2">
        <i class="bi bi-box-arrow-right"></i> Déconnexion
      </a>
    </div>
  </aside>

  <!-- ================= CONTENU PRINCIPAL ================= -->
  <main class="main-content">
    <header class="main-header d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-burger d-md-none" (click)="toggleSidebar()" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
        
      </div>
      
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/admin/profil" class="d-flex align-items-center gap-2 border-start ps-3 text-reset text-decoration-none" title="Mon profil">
          <div class="text-end d-none d-sm-block">
            <h6 class="mb-0 fw-bold fs-7">Administrateur</h6>
            <small class="text-muted fs-8">Super Admin</small>
          </div>
          <img src="https://ui-avatars.com/api/?name=Admin+Voyage&background=007f78&color=fff" class="rounded-circle" width="38" height="38" alt="Avatar">
        </a>
      </div>
    </header>

    <!-- Zone dynamique où s'affichent Agences, Trajets, Offres, etc. -->
    <router-outlet></router-outlet>
  </main>
</div>
